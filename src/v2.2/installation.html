<html>
<head>
    <meta charset="UTF-8">
    <title>BeckerBox</title>
	<link rel="stylesheet" href="../fontawesome/all.css">
    <script src="js/jsalert.js" light-mode></script>
    <style>
:root {
    --background-color: #f0f0f0;
    --primary-color: #1c96ce;
    --secondary-color: #98aab2;
    --green: #19c265;
    --button-font-color: #313131;
    --font-family: 'Poppins', sans-serif;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background-color: var(--background-color);
    font-family: var(--font-family);
}
i { pointer-events: none; }
a { color: inherit; }
main {
    display: flex;
    flex-direction: row;
    flex: 1;
    .left-steps {
        background-color: white;
        border-right: 1px solid #e0e0e0;
        overflow-y: auto;
        height: calc(100vh - 2.75rem);
        display: flex;
        justify-content: space-evenly;
        flex-direction: column;
        padding: 0 50px;
    }
    .step-item {
        display: flex;
        flex-direction: row;
        align-items: center;
        position: relative;
    }
    .step-item:not(:last-child):before {
        content: "";
        position: absolute;
        width: 2px;
        height: 20px;
        background-color: #e0e0e0;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
    }
    .step-item.completed:not(:last-child):before {
        background-color: var(--green);
    }
    .step-item.active:not(:last-child):before {
        background-color: var(--secondary-color);
    }
    .step-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-right: 10px;
        background-color: #f0f0f0;
        border: 2px solid #e0e0e0;
        color: #999;
    }
    .step-item.completed .step-circle {
        background-color: var(--green);
        border-color: var(--green);
        color: white;
    }
    .step-item.active .step-circle {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
        color: white;
    }
    .step-item.locked {
        opacity: 0.45;
        cursor: not-allowed;
    }
    .step-item.locked .step-circle,
    .step-item.locked .step-label {
        cursor: not-allowed;
    }
    .step-item.failed .step-circle {
        background-color: #fff1f1;
        border-color: #d32f2f;
        color: #d32f2f;
    }
    .step-label {
        font-size: 14px;
        text-align: center;
        color: #999;
        font-weight: 500;
    }
    .step-item.completed .step-label {
        color: #333;
    }
    .step-item.active .step-label {
        color: var(--primary-color);
        font-weight: 600;
    }
    .left-image {
        background: url('./assets/left-image-default.jpg') no-repeat center center;
        filter: brightness(0.8);
        background-size: contain;
        background-color: white;
        flex: 1;
    }
    .body {
        flex: 3;
        display: flex;
        flex-direction: column;
        padding: 10px;

        .content {
            flex: 1;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .content.half {
            justify-content: center;
        }
        .content.page {
            margin-top: 2rem;
        }
        .large-text {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .step-instructions {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .step-details {
            display: flex;
            flex-direction: column;
        }
        .checks-list {
            background-color: #fafafa;
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .checks-list.has-failures {
            border-left-color: #d32f2f;
        }
        .check-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
            color: #555;
        }
        .check-item.success {
            color: #167a43;
        }
        .check-item.failure {
            color: #8f2525;
        }
        .check-status-icon {
            width: 20px;
            text-align: center;
            margin-right: 8px;
            flex: 0 0 20px;
        }
        .check-item:not(:last-child) {
            border-bottom: 1px solid #eee;
            margin-bottom: 8px;
        }
        .step-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    }
}
.content .footnote {
    font-size: 12px;
    color: #999;
    position: absolute;
    bottom: 5px;
    right: 10px;
    text-align: right;
}


.title {
    font-size: 24px;
    color: #555;
    padding: 10px 0;
}
.subtitle {
    font-size: 18px;
    color: #777;
    padding: 0 10px;
    text-shadow: 0 0 0px rgba(255, 255, 0, 0);
    transition: text-shadow 0.5s ease;
}
.subtitle.highlight-change {
    /* State when text changes: bright shadow */
    text-shadow: 0 0 10px rgb(255 118 0);
    transition: none; /* Instant apply on class add */
}


header {
    -webkit-app-region: drag;
    * {
        -webkit-app-region: no-drag;
    }
    .installer-name {
        font-size: 18px;
        color: #333;
    }
    .window-controls {
        position: absolute;
        right: 0;
        display: flex;
        height: 100%;

        .control-button {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            transition: background-color 0.2s, color 0.2s;
        }
        .minimize:not(:disabled):hover {
            background-color: #e5e5e5;
        }
        .close:not(:disabled):hover {
            background-color: #e81123;
            color: white;
        }
    }
}
footer {
    min-height: 2rem;
}
footer .buttons-right {
    margin-left: auto;
    * {
        margin-left: 8px;
    }
}
footer .buttons-left {
    * {
        margin-right: 8px;
    }
}

line {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    height: 0;
    max-height: 0;
    border-bottom: 1px solid #ccc;
}
line span {
    position: absolute;
    background-color: var(--background-color);
    padding: 0 10px;
    color: #777;
    font-size: 14px;
}



header, footer {
    position: relative;
    flex: 0 0 auto;
    background-color: var(--background-color);
    box-shadow: 0 0 5px 1px rgba(0, 0, 0, 0.1);
    padding: 10px;
    display: flex;
    align-items: center;
}



button, input[type="text"] {
    background-color: var(--background-color);
    border: 2px solid var(--secondary-color);
    color: var(--button-font-color);
    padding: 5px 20px;
    font-size: 16px;
    border-radius: 5px;
    min-width: 100px;
}
button {
    cursor: pointer;
    transition: box-shadow 0.1s;
}
button:not(:disabled):hover {
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
button.primary {
    border-color: var(--primary-color);
}
button.green {
    border-color: var(--green);
}
button.padding {
    padding: 1.5rem 1.5rem;
}

.loader-container {
    display: flex;
    flex-direction: column;
    pointer-events: none;
    opacity: 0;
    position: absolute;
    height: 100%;
    width: 100%;
    z-index: 9999999;
    background-color: rgba(255, 255, 255, 0.7);
    justify-content: center;
    align-items: center;
    height: 100%;
    transition: opacity 0.2s ease;
    &.active {
        pointer-events: auto;
        opacity: 1;
    }
    .msg {
        font-size: 1.2rem;
        margin-top: 1rem;
    }
    .loader {
        width: 150px;
        height: 150px;
        background-color: #75d1f2;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 20px 3px rgba(0, 0, 0, 0.5) inset,
        0 5px 12px rgba(0, 0, 0, 0.15);
        overflow: hidden;
    }
    .loader:before,
    .loader:after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 45%;
        top: -40%;
        background-color: #fff;
        animation: wave 5s linear infinite;
    }
    .loader:before {
        border-radius: 30%;
        background: rgba(255, 255, 255, 0.4);
        animation: wave 5s linear infinite;
    }
}
@keyframes wave {
    0% {
        transform: rotate(0);
    }
    100% {
        transform: rotate(360deg);
    }
}
    </style>
</head>
<body>
    <header>
        <span class="installer-name"><img src="img/logo-with-words-black.svg" style="display: inline-block; max-height: 1.3rem;"></span>
        <div class="window-controls">
            <div class="control-button close" id="window-close-button" onclick="window.close()"><i class="fa-solid fa-xmark"></i></div>
        </div>
    </header>
    <main>
        <div class="left-steps" id="steps-container"></div>
        <div class="body">
            <span class="title" id="page-title"></span>
            <span class="subtitle" id="page-subtitle"></span>
            <div class="content">
                <div id="step-instructions" class="step-instructions"></div>
                <div id="step-details" class="step-details"></div>
            </div>
        </div>
    </main>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="msg"></div>
    </div>

    <script>

class InstallerGUI {
    constructor(dataConfig) {
        this.data = dataConfig;
        this.lastActionError = null;
        this.init();
    }

    init() {
        this.updateOverallSuccess();
        this.renderSteps();
        this.renderCurrentStep();
    }

    getStepStatus(step) {
        if (!step.check) {
            return 'pending';
        }

        if (!step.check.success) {
            return 'failed';
        }

        return 'completed';
    }

    isStepSuccessful(step) {
        return this.getStepStatus(step) === 'completed';
    }

    updateOverallSuccess() {
        const actionableSteps = this.data.steps.filter((step) => step.check);
        this.data.success = actionableSteps.length > 0 && actionableSteps.every((step) => this.isStepSuccessful(step));
    }

    canOpenStep(stepIndex) {
        if (stepIndex < 0 || stepIndex >= this.data.steps.length) {
            return false;
        }

        for (let index = 0; index < stepIndex; index++) {
            if (!this.isStepSuccessful(this.data.steps[index])) {
                return false;
            }
        }

        return true;
    }

    getNextStepIndex(startIndex) {
        for (let index = startIndex + 1; index < this.data.steps.length; index++) {
            const step = this.data.steps[index];
            if (!step.check || !this.isStepSuccessful(step)) {
                return index;
            }
        }

        return this.data.steps.length - 1;
    }

    mergeCheck(newCheck, fallbackStepIndex = this.data.currentStep) {
        if (!newCheck || typeof newCheck !== 'object') {
            return;
        }

        if (newCheck.reason) {
            for (const step of this.data.steps) {
                if (step.check && step.check.reason === newCheck.reason) {
                    Object.assign(step.check, newCheck);
                    this.updateOverallSuccess();
                    return;
                }
            }
        }

        const fallbackStep = this.data.steps[fallbackStepIndex];
        if (fallbackStep) {
            fallbackStep.check = fallbackStep.check ? { ...fallbackStep.check, ...newCheck } : newCheck;
        }

        this.updateOverallSuccess();
    }

    setLoadingState(isLoading, message = '') {
        const loader = document.querySelector('.loader-container');
        const msgNode = loader ? loader.querySelector('.msg') : null;

        if (msgNode) {
            msgNode.textContent = message;
        }

        if (loader) {
            loader.classList.toggle('active', isLoading);
        }
    }

    renderSteps() {
        const container = document.getElementById('steps-container');
        container.innerHTML = '';

        this.data.steps.forEach((step, index) => {
            const isActive = index === this.data.currentStep;
            const isLocked = !this.canOpenStep(index);
            const status = this.getStepStatus(step);
            const isCompleted = status === 'completed';
            const isFailed = status === 'failed';

            const stepEl = document.createElement('div');
            stepEl.className = 'step-item ' + (isCompleted ? 'completed' : '') + (isFailed ? 'failed' : '') + (isActive ? ' active' : '') + (isLocked && !isActive ? ' locked' : '');
            if (!isLocked || isActive) {
                stepEl.onclick = () => this.goToStep(index);
            }

            const circle = document.createElement('div');
            circle.className = 'step-circle';
            if (isCompleted) {
                circle.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if (isFailed) {
                circle.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else {
                circle.textContent = index + 1;
            }

            const label = document.createElement('div');
            label.className = 'step-label';
            label.textContent = step.title;

            stepEl.appendChild(circle);
            stepEl.appendChild(label);
            container.appendChild(stepEl);
        });
    }

    renderCurrentStep() {
        const step = this.data.steps[this.data.currentStep];
        
        document.getElementById('page-title').textContent = step.title;
        document.getElementById('page-subtitle').textContent = step.instructions;

        const instructionsDiv = document.getElementById('step-instructions');
        const detailsParagraph = document.createElement('p');
        detailsParagraph.textContent = step.details;
        instructionsDiv.innerHTML = '';
        instructionsDiv.appendChild(detailsParagraph);

        const detailsDiv = document.getElementById('step-details');
        detailsDiv.innerHTML = '';

        if (this.lastActionError) {
            const errorRow = document.createElement('div');
            errorRow.className = 'check-item failure';
            errorRow.innerHTML = `
                <i class="fa-solid fa-triangle-exclamation check-status-icon"></i>
                <span>${this.lastActionError}</span>
            `;
            detailsDiv.appendChild(errorRow);
        }

        // Show the single check with explicit success/failure state.
        if (step.check) {
            const checkList = document.createElement('div');
            checkList.className = 'checks-list' + (!step.check.success ? ' has-failures' : '');

            const checkItem = document.createElement('div');
            const className = step.check.success ? 'success' : 'failure';
            const iconName = step.check.success ? 'fa-circle-check' : 'fa-circle-xmark';
            checkItem.className = `check-item ${className}`;
            checkItem.innerHTML = `
                <i class="fa-solid ${iconName} check-status-icon"></i>
                <span>${step.check.message}</span>
            `;
            checkList.appendChild(checkItem);

            detailsDiv.appendChild(checkList);
        }

        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'step-buttons';
        
        if (this.data.currentStep > 0) {
            const backBtn = document.createElement('button');
            backBtn.textContent = 'Back';
            backBtn.onclick = () => this.previousStep();
            buttonsDiv.appendChild(backBtn);
        }

        const actionBtn = document.createElement('button');
        actionBtn.className = 'primary';
        if (step?.check?.success) {
            actionBtn.textContent = 'Next';
            actionBtn.onclick = () => this.nextStep();
        } else {
            actionBtn.textContent = step.buttonText;
            actionBtn.onclick = () => this.handleStepAction(step.buttonAction);
        }
        buttonsDiv.appendChild(actionBtn);

        // Only show Next button if not the last step
        if (this.data.currentStep === this.data.steps.length - 1) {
            actionBtn.className = 'primary green';
        }

        detailsDiv.appendChild(buttonsDiv);
    }

    goToStep(stepIndex) {
        if (this.canOpenStep(stepIndex)) {
            this.lastActionError = null;
            this.data.currentStep = stepIndex;
            this.renderSteps();
            this.renderCurrentStep();
        }
    }

    nextStep() {
        if (this.data.currentStep < this.data.steps.length - 1) {
            this.lastActionError = null;
            this.data.currentStep = this.getNextStepIndex(this.data.currentStep);
            this.renderSteps();
            this.renderCurrentStep();
        }
    }

    previousStep() {
        if (this.data.currentStep > 0) {
            this.lastActionError = null;
            this.data.currentStep--;
            this.renderSteps();
            this.renderCurrentStep();
        }
    }

    async handleStepAction(action) {
        const currentStep = this.data.steps[this.data.currentStep];
        this.lastActionError = null;

        try {
            this.setLoadingState(true, 'Running installation step...');

            const installerApi = window.electron && window.electron.installation;
            if (!installerApi || typeof installerApi[action] !== 'function') {
                throw new Error(`Installer action not available: ${action}`);
            }

            const newCheck = await installerApi[action]();
            if (newCheck && newCheck.success===false && action === 'launch') {
                // if there was a fail in the launch, that means some other step must have failed as well, so we should refresh all steps to get the updated status
                const updatedSteps = await installerApi.getSteps();
                this.data.steps = updatedSteps;
            } else {
                this.mergeCheck(newCheck, this.data.currentStep);
            }

            if (this.isStepSuccessful(currentStep)) {
                this.nextStep();
                return;
            }
        } catch (error) {
            this.lastActionError = error && error.message ? error.message : 'Unknown installation error.';
        } finally {
            this.setLoadingState(false, '');
        }

        this.renderSteps();
        this.renderCurrentStep();
    }
}

// Initialize the installer GUI when page loads
document.addEventListener('DOMContentLoaded', async () => {
    const steps = await window.electron.installation.getSteps();
    console.log('Received installation steps:', steps); 
    
    const currentStep = steps.findIndex((step) => !step.check || !step.check.success);
    new InstallerGUI({ steps, currentStep: currentStep === -1 ? steps.length - 1 : currentStep });
});

    </script>
</body>
</html>
