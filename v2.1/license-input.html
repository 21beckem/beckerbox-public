<html>
<head>
    <meta charset="UTF-8">
    <title>BeckerBox</title>
	<link rel="stylesheet" href="../fontawesome/all.css">
    <script src="js/jsalert.js" light-mode></script>
    <style>
:root {
    --background-color: #f0f0f0;
    --primary-color: #1c96ce;
    --secondary-color: #98aab2;
    --green: #19c265;
    --button-font-color: #313131;
    --font-family: 'Poppins', sans-serif;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background-color: var(--background-color);
    font-family: var(--font-family);
}
i { pointer-events: none; }
a { color: inherit; }
main {
    display: flex;
    flex-direction: row;
    flex: 1;
    .left-image {
        background: url('./assets/left-image-default.jpg') no-repeat center center;
        filter: brightness(0.8);
        background-size: contain;
        background-color: white;
        flex: 1;
    }
    .body {
        flex: 3;
        display: flex;
        flex-direction: column;
        padding: 10px;

        .content {
            flex: 1;
            padding: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .content.half {
            justify-content: center;
        }
        .content.page {
            margin-top: 2rem;
        }
        .large-text {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    }
}
.content .footnote {
    font-size: 12px;
    color: #999;
    position: absolute;
    bottom: 5px;
    right: 10px;
    text-align: right;
}


.title {
    font-size: 24px;
    color: #555;
    padding: 10px 0;
}
.subtitle {
    font-size: 18px;
    color: #777;
    padding: 0 10px;
    text-shadow: 0 0 0px rgba(255, 255, 0, 0);
    transition: text-shadow 0.5s ease;
}
.subtitle.highlight-change {
    /* State when text changes: bright shadow */
    text-shadow: 0 0 10px rgb(255 118 0);
    transition: none; /* Instant apply on class add */
}


header {
    -webkit-app-region: drag;
    * {
        -webkit-app-region: no-drag;
    }
    .installer-name {
        font-size: 18px;
        color: #333;
    }
    .window-controls {
        position: absolute;
        right: 0;
        display: flex;
        height: 100%;

        .control-button {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
            transition: background-color 0.2s, color 0.2s;
        }
        .minimize:not(:disabled):hover {
            background-color: #e5e5e5;
        }
        .close:not(:disabled):hover {
            background-color: #e81123;
            color: white;
        }
    }
}
footer {
    min-height: 2rem;
}
footer .buttons-right {
    margin-left: auto;
    * {
        margin-left: 8px;
    }
}
footer .buttons-left {
    * {
        margin-right: 8px;
    }
}

line {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    height: 0;
    max-height: 0;
    border-bottom: 1px solid #ccc;
}
line span {
    position: absolute;
    background-color: var(--background-color);
    padding: 0 10px;
    color: #777;
    font-size: 14px;
}



header, footer {
    position: relative;
    flex: 0 0 auto;
    background-color: var(--background-color);
    box-shadow: 0 0 5px 1px rgba(0, 0, 0, 0.1);
    padding: 10px;
    display: flex;
    align-items: center;
}



button, input[type="text"] {
    background-color: var(--background-color);
    border: 2px solid var(--secondary-color);
    color: var(--button-font-color);
    padding: 5px 20px;
    font-size: 16px;
    border-radius: 5px;
    min-width: 100px;
}
button {
    cursor: pointer;
    transition: box-shadow 0.1s;
}
button:not(:disabled):hover {
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
button.primary {
    border-color: var(--primary-color);
}
button.green {
    border-color: var(--green);
}
button.padding {
    padding: 1.5rem 1.5rem;
}

.loader-container {
    display: flex;
    flex-direction: column;
    pointer-events: none;
    opacity: 0;
    position: absolute;
    height: 100%;
    width: 100%;
    z-index: 9999999;
    background-color: rgba(255, 255, 255, 0.7);
    justify-content: center;
    align-items: center;
    height: 100%;
    transition: opacity 0.2s ease;
    &.active {
        pointer-events: auto;
        opacity: 1;
    }
    .msg {
        font-size: 1.2rem;
        margin-top: 1rem;
    }
    .loader {
        width: 150px;
        height: 150px;
        background-color: #75d1f2;
        border-radius: 50%;
        position: relative;
        box-shadow: 0 0 20px 3px rgba(0, 0, 0, 0.5) inset,
        0 5px 12px rgba(0, 0, 0, 0.15);
        overflow: hidden;
    }
    .loader:before,
    .loader:after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 45%;
        top: -40%;
        background-color: #fff;
        animation: wave 5s linear infinite;
    }
    .loader:before {
        border-radius: 30%;
        background: rgba(255, 255, 255, 0.4);
        animation: wave 5s linear infinite;
    }
}
@keyframes wave {
    0% {
        transform: rotate(0);
    }
    100% {
        transform: rotate(360deg);
    }
}
    </style>
</head>
<body>
    <header>
        <span class="installer-name"><img src="img/logo-with-words-black.svg" style="display: inline-block; max-height: 1.3rem;"></span>
        <div class="window-controls">
            <div class="control-button close" id="window-close-button" onclick="window.close()"><i class="fa-solid fa-xmark"></i></div>
        </div>
    </header>
    <main>
        <div class="body">
            <span class="title" id="page-title">Please verify your purchase</span>
            <span class="subtitle" id="page-subtitle"></span>
            <div class="content">
                <br>
                <div class="content" id="input-key-container">
                    <div class="content half" style="flex: 2;">
                        <input type="text" id="licenseKey" style="padding: 1rem; text-align: center; margin: 0 auto; width: 50%;" placeholder="Enter your license key here">
                        <br>
                        <button class="primary" style="padding: 1rem 2.5rem; margin: 0 auto;" onclick="submitLicense()">Submit</button>
                    </div>
                    <line><span>OR</span></line>
                    <div class="content half" style="flex: 1">
                        <center>
                            <button class="green" style="padding: 1rem 2.5rem; margin: 0 auto;" onclick="watchAd()">
                                Watch an Ad to Continue <i class="fa-solid fa-circle-play"></i>
                            </button>
                        </center>
                    </div>
                </div>
                <div class="page content" id="confirm-transfer-container" style="display: none;">
                    <span style="text-align: center; display: block; opacity: 0.7;">
                        By transfering your license to this device, it will be deactivated on the previous device.
                        <br>
                        Would you like to continue?
                    </span>
                    <br><br>
                    <div style="display: flex; flex-direction: row; justify-content: center; gap: 20px; width: 100%;">
                        <button class="secondary" style="width: 30vw; padding: 1rem 2.5rem;" onclick="updateUI({
                            success: false,
                            reason: 'transfer cancelled',
                            message: 'License transfer cancelled.',
                            request: validity.request
                        })">No</button>
                        <button class="primary" style="width: 30vw; padding: 1rem 2.5rem;" onclick="confirmTransfer()">Yes</button>
                    </div>
                </div>
                <div class="page content" id="success-container" style="display: none;">
                    <i class="fa-regular fa-circle-check" style="font-size: 10rem; color: green; display: block; text-align: center;"></i>
                </div>
            </div>
        </div>
    </main>
    <div class="loader-container">
        <div class="loader"></div>
        <div class="msg"></div>
    </div>

    <footer>
        <div class="buttons-left"></div>
        <div class="buttons-right"></div>
    </footer>

        <script>
let validity = JSON.parse(new URLSearchParams(location.search).get('validity') || 'null');
if (validity === null)
    validity = {
        success: false,
        reason: 'unknown',
        message: 'An unknown error occurred while launching or verifying your license. Please contact support.',
        devNotes: 'the "validity" query parameter was not provided or could not be parsed'
    };


const keyInputContainer = document.getElementById('input-key-container');
const confirmTransferContainer = document.getElementById('confirm-transfer-container');
const successContainer = document.getElementById('success-container');
const pageTitle = document.getElementById('page-title');
const pageSubtitle = document.getElementById('page-subtitle');
function updateUI(thisValidity=false) {
    if (thisValidity !== false)
        validity = thisValidity;
    console.log('License validity:', validity);

    pageSubtitle.classList.remove('highlight-change');
    pageSubtitle.classList.add('highlight-change');
    setTimeout(() => {
        pageSubtitle.classList.remove('highlight-change');
    }, 100);

    if (validity.success) {
        keyInputContainer.style.display = 'none';
        confirmTransferContainer.style.display = 'none';
        successContainer.style.display = 'block';
        pageTitle.textContent = 'Success';
        pageSubtitle.textContent = validity.message + ' Launching BeckerBox...';

        setTimeout(() => {
            window.close();
        }, 2000);
        return;
    }

    if (validity.reason === 'wrong seat') {
        keyInputContainer.style.display = 'none';
        confirmTransferContainer.style.display = 'flex';
        successContainer.style.display = 'none';
        pageTitle.textContent = 'License Transfer Required';
    } else if (validity.reason === 'invalid') {
        keyInputContainer.style.display = 'flex';
        confirmTransferContainer.style.display = 'none';
        successContainer.style.display = 'none';
        pageTitle.textContent = 'Your license key is invalid';
    } else {
        keyInputContainer.style.display = 'flex';
        confirmTransferContainer.style.display = 'none';
        successContainer.style.display = 'none';
        pageTitle.textContent = 'Please verify your purchase';
    }

    pageSubtitle.textContent = validity.message;
}
updateUI();

const loaderContainer = document.querySelector('.loader-container');
const msgElement = document.querySelector('.loader-container .msg');
let currentlySubmitting = false;
function setLoading(isLoading, message='Please wait...') {
    if (isLoading) {
        msgElement.textContent = message;
        loaderContainer.classList.add('active');
        currentlySubmitting = true;
    } else {
        loaderContainer.classList.remove('active');
        msgElement.textContent = '';
        currentlySubmitting = false;
    }
}
async function submitLicense() {
    if (currentlySubmitting) return;
    setLoading(true, 'Validating license key...');

    const licenseKey = document.getElementById('licenseKey').value;
    if (!licenseKey) {
        JSAlert.alert('Please enter a license key', 'No license key entered', JSAlert.Icons.Warning).then(() => {
            currentlySubmitting = false;
        });
        setLoading(false);
        return;
    }
    let result = await window.electron.auth.submitLicenseKey(licenseKey, false);
    
    updateUI(result);

    setLoading(false);
}

async function confirmTransfer() {
    if (currentlySubmitting) return;
    setLoading(true, 'Transferring license...');
    
    updateUI(await window.electron.auth.submitLicenseKey(validity.request.key, true));

    setLoading(false);
}

async function watchAd() {
    if (currentlySubmitting) return;
    setLoading(true, 'Loading ad...');

    let result = await window.electron.auth.watchAd();

    if (!result.success) {
        JSAlert.alert(result.message, 'There was an issue', JSAlert.Icons.Error).then(() => {
            currentlySubmitting = false;
        });
        setLoading(false);
        return;
    }

    updateUI(result);

    setLoading(false);
}


// add event listener for enter key on license key input
document.getElementById('licenseKey').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        submitLicense();
    }
});
    </script>
</body>
</html>
